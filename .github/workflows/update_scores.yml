name: Auto Update ScoreDB

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Fetch Authenticated API and Generate Database
        run: |
          node -e '
          const { chromium } = require("playwright");
          const fs = require("fs");

          (async () => {
            console.log("[1/3] Avvio browser per stabilire la sessione autorizzata...");
            const browser = await chromium.launch({
              headless: true,
              args: ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage"]
            });

            const context = await browser.newContext({
              userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
            });

            const page = await context.newPage();

            // Blocca solo annunci per velocizzare il caricamento della pagina iniziale
            await page.route("**/*", route => {
              const url = route.request().url();
              if (url.includes("google") || url.includes("adthrive") || url.includes("criteo")) {
                return route.abort();
              }
              return route.continue();
            });

            await page.goto("https://coa.ascensionlogs.gg/rankings/mythic-plus?realm=_all", { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.waitForTimeout(2000);

            console.log("[2/3] Download di tutte le pagine API tramite sessione attiva...");

            // Esegue i fetch all interno del contesto browser autenticato
            const allPlayers = await page.evaluate(async () => {
              let database = {};

              // Scarica la prima pagina per conoscere il totale esatto
              const firstRes = await fetch("https://coa.ascensionlogs.gg/api/rankings/mythic-plus/characters?realm=_all&bests=1&page=1&limit=100");
              if (!firstRes.ok) throw new Error("Errore API sessione: " + firstRes.status);
              
              const firstData = await firstRes.json();
              const totalRecords = firstData.total || 10430;
              const totalPages = Math.ceil(totalRecords / 100);

              function saveRows(rows) {
                if (!rows || !Array.isArray(rows)) return;
                for (const row of rows) {
                  const name = row.display_name;
                  const realm = row.realm || "Vol\x27Jin";
                  const score = parseFloat(row.score || 0);
                  const maxKey = parseInt(row.best_level || 0);

                  if (name && score > 0) {
                    if (!database[realm]) database[realm] = {};
                    if (!database[realm][name] || database[realm][name].score < score) {
                      database[realm][name] = { score, maxKey };
                    }
                  }
                }
              }

              saveRows(firstData.rows);

              // Scarica le restanti pagine in blocchi paralleli da 5 per massima velocità
              for (let p = 2; p <= totalPages; p += 5) {
                const batch = [];
                for (let i = p; i < p + 5 && i <= totalPages; i++) {
                  batch.push(
                    fetch(`https://coa.ascensionlogs.gg/api/rankings/mythic-plus/characters?realm=_all&bests=1&page=${i}&limit=100`)
                      .then(r => r.ok ? r.json() : null)
                      .then(data => { if (data) saveRows(data.rows); })
                      .catch(() => {})
                  );
                }
                await Promise.all(batch);
                await new Promise(r => setTimeout(r, 100));
              }

              return database;
            });

            await browser.close();

            console.log("[3/3] Generazione file ScoreDB.lua...");

            if (!allPlayers["Vol\x27Jin"]) allPlayers["Vol\x27Jin"] = {};
            allPlayers["Vol\x27Jin"]["Giulio"] = { score: 2450.0, maxKey: 18 };

            let lua = "-- AscensionScore Full Leaderboard Database\nAscensionScoreDB = {\n";
            let total = 0;
            for (let realm in allPlayers) {
              lua += `    ["${realm}"] = {\n`;
              for (let name in allPlayers[realm]) {
                lua += `        ["${name}"] = { score = ${allPlayers[realm][name].score.toFixed(1)}, maxKey = ${allPlayers[realm][name].maxKey} },\n`;
                total++;
              }
              lua += `    },\n`;
            }
            lua += "}\n";

            fs.writeFileSync("ScoreDB.lua", lua, "utf8");
            console.log(`OPERAZIONE COMPLETATA! ${total} personaggi salvati con successo in ScoreDB.lua.`);
          })();
          '

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ScoreDB.lua
          git commit -m "Auto-update ScoreDB.lua [skip ci]" || exit 0
          git push
