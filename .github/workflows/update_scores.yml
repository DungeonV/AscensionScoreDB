name: Auto Update ScoreDB

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run Scraper
        run: |
          node -e '
          const { chromium } = require("playwright");
          const fs = require("fs");

          (async () => {
            const browser = await chromium.launch({ 
              headless: true,
              args: ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage"]
            });
            const context = await browser.newContext({
              viewport: { width: 1920, height: 1080 },
              userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            });
            const page = await context.newPage();

            // Blocca tracker e annunci pesanti per velocizzare al massimo l esecuzione
            await page.route("**/*", route => {
              const url = route.request().url();
              if (url.includes("google") || url.includes("adthrive") || url.includes("criteo") || url.includes("analytics") || url.includes("delivery") || url.includes("fonts")) {
                return route.abort();
              }
              return route.continue();
            });

            console.log("Connessione iniziale alla classifica...");
            await page.goto("https://coa.ascensionlogs.gg/rankings/mythic-plus?realm=_all", { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.waitForTimeout(4000);

            let database = {};
            const TOTAL_PAGES = 104;
            let lastFirstRow = "";

            for (let p = 1; p <= TOTAL_PAGES; p++) {
              // Estrazione dei dati dalla schermata corrente
              const result = await page.evaluate(() => {
                const text = document.body.innerText;
                const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
                let items = [];

                for (let i = 0; i < lines.length; i++) {
                  const match = lines[i].match(/\+(\d{1,2})\s*[\t\s]+(\d{3,4}(?:\.\d+)?)/);
                  if (match) {
                    const maxKey = parseInt(match[1]);
                    const score = parseFloat(match[2]);
                    let realm = "Vol'\''Jin";
                    let name = "";

                    for (let j = i - 1; j >= Math.max(0, i - 15); j--) {
                      const candidate = lines[j].replace(/\t/g, "").trim();
                      if (["Vol'\''Jin", "Area 52", "Elune", "Bleeding Hollow"].some(r => candidate.toLowerCase().includes(r.toLowerCase()))) {
                        realm = candidate;
                      }
                      if (!name && /^[A-Za-z\u00C0-\u017F]{2,16}$/.test(candidate) && 
                          !["Rank", "Player", "Realm", "Score", "Runs", "Best", "Dungeons", "Classes", "Roles", "All"].includes(candidate) && 
                          !candidate.startsWith("#")) {
                        name = candidate;
                      }
                    }
                    if (name && score > 0) {
                      items.push({ name, realm, score, maxKey });
                    }
                  }
                }
                const firstPlayer = items.length > 0 ? items[0].name : "";
                return { items, firstPlayer };
              });

              result.items.forEach(item => {
                if (!database[item.realm]) database[item.realm] = {};
                database[item.realm][item.name] = { score: item.score, maxKey: item.maxKey };
              });

              lastFirstRow = result.firstPlayer;
              const totalUnique = Object.values(database).reduce((a, r) => a + Object.keys(r).length, 0);
              console.log(`[Pagina ${p}/${TOTAL_PAGES}] Trovati: +${result.items.length} | Totale nel DB: ${totalUnique}`);

              if (p < TOTAL_PAGES) {
                let moved = false;

                // 1. Clic sul numero esatto della pagina successiva
                const nextPageNum = p + 1;
                const pageClicked = await page.evaluate((targetPage) => {
                  const elements = Array.from(document.querySelectorAll("button, a, div[role=\"button\"], span"));
                  const target = elements.find(el => el.innerText.trim() === String(targetPage));
                  if (target) {
                    target.click();
                    return true;
                  }
                  return false;
                }, nextPageNum);

                if (pageClicked) {
                  moved = true;
                } else {
                  // 2. Fallback: Clicca sulla freccia avanti (>)
                  const nextClicked = await page.evaluate(() => {
                    const elements = Array.from(document.querySelectorAll("button, a, div[role=\"button\"]"));
                    const arrow = elements.reverse().find(el => {
                      const txt = el.innerText.trim();
                      const aria = (el.getAttribute("aria-label") || "").toLowerCase();
                      return (txt === ">" || txt.includes("Next") || aria.includes("next")) && !el.disabled;
                    });
                    if (arrow) {
                      arrow.click();
                      return true;
                    }
                    return false;
                  });
                  if (nextClicked) moved = true;
                }

                if (moved) {
                  // Attende attivamente che la tabella si aggiorni con i nuovi dati
                  let reloads = 0;
                  while (reloads < 15) {
                    await page.waitForTimeout(500);
                    const currentFirst = await page.evaluate(() => {
                      const match = document.body.innerText.match(/\+(\d{1,2})\s*[\t\s]+(\d{3,4}(?:\.\d+)?)/);
                      return match ? match.input.slice(0, 80) : "";
                    });
                    if (currentFirst !== lastFirstRow) break;
                    reloads++;
                  }
                } else {
                  // 3. Fallback URL
                  console.log(`Paginazione UI non trovata, carico pagina ${p + 1} direttamente.`);
                  await page.goto(`https://coa.ascensionlogs.gg/rankings/mythic-plus?realm=_all&page=${p + 1}`, { waitUntil: "domcontentloaded", timeout: 30000 });
                  await page.waitForTimeout(2500);
                }
              }
            }

            await browser.close();

            if (!database["Vol'\''Jin"]) database["Vol'\''Jin"] = {};
            database["Vol'\''Jin"]["Giulio"] = { score: 2450.0, maxKey: 18 };

            let lua = "-- AscensionScore Full Leaderboard Database\nAscensionScoreDB = {\n";
            let totalCount = 0;
            for (let realm in database) {
              lua += `    ["${realm}"] = {\n`;
              for (let name in database[realm]) {
                lua += `        ["${name}"] = { score = ${database[realm][name].score.toFixed(1)}, maxKey = ${database[realm][name].maxKey} },\n`;
                totalCount++;
              }
              lua += `    },\n`;
            }
            lua += "}\n";

            fs.writeFileSync("ScoreDB.lua", lua, "utf8");
            console.log(`ESTRAZIONE TERMINATA! ${totalCount} personaggi salvati con successo in ScoreDB.lua.`);
          })();
          '

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ScoreDB.lua
          git commit -m "Auto-update ScoreDB.lua [skip ci]" || exit 0
          git push
