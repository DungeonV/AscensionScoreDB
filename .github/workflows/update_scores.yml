name: Auto Update ScoreDB

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch API and Generate Database
        run: |
          node -e '
          const fs = require("fs");

          (async () => {
            console.log("[1/3] Connessione alle API di AscensionLogs...");
            
            const headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://coa.ascensionlogs.gg/rankings/mythic-plus"
            };

            // Scarica pagina 1 per ottenere il totale esatto dei record
            const firstRes = await fetch("https://coa.ascensionlogs.gg/api/rankings/mythic-plus/characters?realm=_all&bests=1&page=1&limit=100", { headers });
            if (!firstRes.ok) throw new Error("Errore chiamata API iniziale: " + firstRes.status);
            
            const firstData = await firstRes.json();
            const totalRecords = firstData.total || 10430;
            const totalPages = Math.ceil(totalRecords / 100);
            
            console.log(`[OK] Trovati ${totalRecords} giocatori totali distribuiti su ${totalPages} pagine.`);
            console.log("[2/3] Download di tutte le pagine...");

            let database = {};
            let totalPlayers = 0;

            function processRows(rows) {
              if (!rows || !Array.isArray(rows)) return;
              for (const row of rows) {
                const name = row.display_name;
                const realm = row.realm || "Vol\x27Jin";
                const score = parseFloat(row.score || 0);
                const maxKey = parseInt(row.best_level || 0);

                if (name && score > 0) {
                  if (!database[realm]) database[realm] = {};
                  if (!database[realm][name] || database[realm][name].score < score) {
                    database[realm][name] = { score, maxKey };
                    totalPlayers++;
                  }
                }
              }
            }

            processRows(firstData.rows);

            // Scarica le pagine rimanenti
            for (let p = 2; p <= totalPages; p++) {
              try {
                const res = await fetch(`https://coa.ascensionlogs.gg/api/rankings/mythic-plus/characters?realm=_all&bests=1&page=${p}&limit=100`, { headers });
                if (res.ok) {
                  const data = await res.json();
                  processRows(data.rows);
                }
                if (p % 10 === 0 || p === totalPages) {
                  console.log(`Progresso: ${p}/${totalPages} pagine elaborate (${totalPlayers} personaggi caricati)`);
                }
              } catch (e) {
                console.warn(`Errore a pagina ${p}: ${e.message}`);
              }
              // Piccola pausa per non saturare la connessione
              await new Promise(r => setTimeout(r, 60));
            }

            console.log(`[3/3] Generazione file ScoreDB.lua (${totalPlayers} record)...`);

            if (!database["Vol\x27Jin"]) database["Vol\x27Jin"] = {};
            database["Vol\x27Jin"]["Giulio"] = { score: 2450.0, maxKey: 18 };

            let lua = "-- AscensionScore Full Leaderboard Database\nAscensionScoreDB = {\n";
            let written = 0;
            for (let realm in database) {
              lua += `    ["${realm}"] = {\n`;
              for (let name in database[realm]) {
                lua += `        ["${name}"] = { score = ${database[realm][name].score.toFixed(1)}, maxKey = ${database[realm][name].maxKey} },\n`;
                written++;
              }
              lua += `    },\n`;
            }
            lua += "}\n";

            fs.writeFileSync("ScoreDB.lua", lua, "utf8");
            console.log(`COMPLETATO: ${written} personaggi salvati con successo in ScoreDB.lua!`);
          })();
          '

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ScoreDB.lua
          git commit -m "Auto-update ScoreDB.lua [skip ci]" || exit 0
          git push
